<!DOCTYPE html>
<html>
<body style="margin: 0; padding: 0; background-color: #f4f4f5; font-family: Arial, sans-serif;">
    <div style="display: none; max-height: 0px; overflow: hidden;">
        {{ code }} is your password reset code. Expires in 15 minutes.
    </div>

    <table width="100%" cellpadding="0" cellspacing="0" style="padding: 40px 20px;">
        <tr>
            <td align="center">
                <table width="100%" style="max-width: 440px; background-color: #ffffff; border-radius: 12px; padding: 32px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
                    <tr>
                        <td align="center">
                            <h2 style="margin: 0 0 12px; color: #18181b; font-size: 22px;">
                                Reset Your Password
                            </h2>
                            <p style="margin: 0 0 24px; color: #52525b; font-size: 15px; line-height: 1.5;">
                                Use the verification code below to reset your password. This code expires in <strong>15 minutes</strong>.
                            </p>

                            <div style="background-color: #f4f4f5; border: 1px solid #e4e4e7; border-radius: 8px; padding: 16px 24px; margin-bottom: 24px;">
                                <span style="font-family: 'Courier New', monospace; font-size: 32px; font-weight: bold; letter-spacing: 6px; color: #18181b; user-select: all; -webkit-user-select: all;">{{ code }}</span>
                            </div>

                            <p style="margin: 0; color: #a1a1aa; font-size: 13px;">
                                If you did not ask to reset your password, you can safely ignore this email.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
